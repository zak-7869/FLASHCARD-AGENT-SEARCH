<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Flashcard Agent Engine</title>
    <style>
        :root {
            --bg-canvas: #f8fafc;
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --success: #10b981;
            --card-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.05), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
        }
        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-canvas);
            margin: 0;
            padding: 40px 16px;
            color: #0f172a;
        }
        .app-container {
            max-width: 650px;
            margin: 0 auto;
        }
        header {
            text-align: center;
            margin-bottom: 32px;
        }
        h1 { margin: 0; font-size: 28px; font-weight: 800; color: #1e293b; }
        p { color: #64748b; margin-top: 6px; font-size: 15px; }
        
        .config-box {
            background: #ffffff;
            padding: 24px;
            border-radius: 16px;
            border: 1px solid #e2e8f0;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.02);
            margin-bottom: 24px;
        }
        .field {
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin-bottom: 16px;
        }
        label { font-weight: 600; font-size: 13px; color: #475569; text-transform: uppercase; letter-spacing: 0.5px; }
        textarea {
            padding: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 15px;
            font-family: inherit;
            min-height: 70px;
            transition: border 0.2s;
        }
        textarea:focus { outline: none; border-color: var(--primary); }
        .flex-row {
            display: flex;
            gap: 16px;
            align-items: flex-end;
        }
        input[type="number"] {
            width: 70px;
            padding: 11px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 15px;
            text-align: center;
        }
        button {
            background-color: var(--primary);
            color: #ffffff;
            border: none;
            padding: 12px 24px;
            font-size: 15px;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.2s;
            flex-grow: 1;
        }
        button:hover { background-color: var(--primary-hover); }
        button:disabled { background-color: #94a3b8; cursor: not-allowed; }

        .spinner-msg {
            text-align: center;
            display: none;
            font-weight: 500;
            color: var(--primary);
            font-size: 14px;
            margin: 20px 0;
        }
        
        /* 3D Flashcard Flipping Rig */
        .stage-wrapper {
            display: none;
            flex-direction: column;
            align-items: center;
            gap: 24px;
        }
        .card-perspective {
            width: 100%;
            height: 300px;
            perspective: 1200px;
            cursor: pointer;
        }
        .card-actor {
            width: 100%;
            height: 100%;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.5s cubic-bezier(0.25, 0.8, 0.25, 1);
        }
        .card-actor.flipped {
            transform: rotateY(180deg);
        }
        .face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 32px;
            box-sizing: border-box;
            border-radius: 20px;
            font-size: 19px;
            text-align: center;
            background: #ffffff;
            box-shadow: var(--card-shadow);
            border: 1px solid #e2e8f0;
        }
        .face-front {
            border-top: 6px solid var(--primary);
            color: #1e293b;
            font-weight: 500;
        }
        .face-back {
            transform: rotateY(180deg);
            background: #fafafa;
            color: #334155;
            border-top: 6px solid var(--success);
            font-size: 16px;
            line-height: 1.6;
            overflow-y: auto;
        }
        .controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            max-width: 280px;
        }
        .nav-btn {
            background-color: #e2e8f0;
            color: #334155;
            padding: 8px 16px;
            font-size: 14px;
            min-width: 75px;
        }
        .nav-btn:hover { background-color: #cbd5e1; }
        #counter { font-size: 14px; font-weight: 600; color: #64748b; }
    </style>
</head>
<body>

<div class="app-container">
    <header>
        <h1>Smart Flashcard Agent</h1>
        <p>Live Web Search Engine (Tavily) + Groq + LangGraph</p>
    </header>

    <div class="config-box">
        <div class="field">
            <label for="topic">Search Topic or Query:</label>
            <textarea id="topic" placeholder="e.g., Latest features in Python 3.13, NASA Artemis mission schedule, or Rust concurrency..."></textarea>
        </div>
        <div class="flex-row">
            <div class="field" style="margin-bottom:0;">
                <label for="count">Cards:</label>
                <input type="number" id="count" min="1" max="10" value="5">
            </div>
            <button id="submitBtn" onclick="runAgent()">Generate via Web Search 🔍</button>
        </div>
    </div>

    <div id="loader" class="spinner-msg">🤖 Querying Tavily Search & mapping state nodes in LangGraph...</div>

    <div id="stage" class="stage-wrapper">
        <div class="card-perspective" onclick="toggleFlip()">
            <div id="cardActor" class="card-actor">
                <div id="frontView" class="face face-front">Front Loading...</div>
                <div id="backView" class="face face-back">Back Loading...</div>
            </div>
        </div>
        <div class="controls">
            <button class="nav-btn" onclick="prev(event)">Back</button>
            <span id="counter">0 / 0</span>
            <button class="nav-btn" onclick="next(event)">Next</button>
        </div>
    </div>
</div>

<script>
    let cards = [];
    let currentIdx = 0;

    async function runAgent() {
        const topic = document.getElementById('topic').value.trim();
        const count = parseInt(document.getElementById('count').value) || 5;
        const btn = document.getElementById('submitBtn');
        const loader = document.getElementById('loader');
        const stage = document.getElementById('stage');

        if (!topic) {
            alert('Please specify a valid concept or real-time query topic first.');
            return;
        }

        btn.disabled = true;
        loader.style.display = 'block';
        stage.style.display = 'none';
        resetFlip();

        try {
            const response = await fetch('/api/generate', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ topic, count })
            });
            const data = await response.json();
            cards = data.cards;

            if(cards && cards.length > 0) {
                currentIdx = 0;
                render();
                stage.style.display = 'flex';
            } else {
                alert('The model returned an empty deck structure. Try revising your query.');
            }
        } catch (e) {
            console.error(e);
            alert('Error running the LangGraph agent backend cycle.');
        } finally {
            btn.disabled = false;
            loader.style.display = 'none';
        }
    }

    function toggleFlip() {
        document.getElementById('cardActor').classList.toggle('flipped');
    }
    function resetFlip() {
        document.getElementById('cardActor').classList.remove('flipped');
    }

    function render() {
        if(!cards.length) return;
        resetFlip();
        setTimeout(() => {
            document.getElementById('frontView').innerText = cards[currentIdx].front;
            document.getElementById('backView').innerText = cards[currentIdx].back;
            document.getElementById('counter').innerText = `${currentIdx + 1} / ${cards.length}`;
        }, 120);
    }

    function next(e) {
        e.stopPropagation();
        if (currentIdx < cards.length - 1) {
            currentIdx++;
            render();
        }
    }
    function prev(e) {
        e.stopPropagation();
        if (currentIdx > 0) {
            currentIdx--;
            render();
        }
    }
</script>
</body>
</html>
